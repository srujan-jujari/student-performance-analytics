<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171717">
    <title>{% block title %}Student Performance Analytics{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='20261020-2') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-shell {% block shell_class %}{% endblock %}">
        {% block sidebar %}{% endblock %}
        <div class="main-shell">
            {% block topbar %}{% endblock %}
            <main class="page-main">
                {% block content %}{% endblock %}
            </main>
            <footer class="app-footer">
                <span class="status-indicator" aria-hidden="true"></span>
                <span>EDUMETRICS</span>
                <span class="footer-divider" aria-hidden="true">/</span>
                <span>Student Performance Analytics</span>
                <span class="footer-note">Synthetic data for demonstration</span>
            </footer>
        </div>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
